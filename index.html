just want you to know that I'm here, and I'll listen whenever you're ready.",school:"And if what's been bothering you has something to do with school, your grades, your family, or the expectations that other people have for you, I hope you know that you don't have to carry all of that weight alone. I know that sometimes, the pressure to do well academically can be exhausting, especially when you feel like you always have to meet certain expectations or prove that you're doing your best. Sometimes, even when you're trying your hardest, it can still feel like you're not doing enough, and I hope you never let those thoughts make you forget how much you're already worth.",family:"And if it's something happening within your family, something you can't easily talk about, or something that makes you feel like you have nowhere to let your feelings out, I'm sorry you're going through that. I know I can't change everything that's happening around you, and I might not always know the right words to say, but I want you to know that you don't have to pretend to be okay with me. You can tell me about the things that make you happy, but you can also tell me about the things that hurt you. You don't have to be strong every single day, and you don't have to figure everything out all at once.",worth:"Please remember that your grades don't define your worth, other people's expectations don't determine your value, and having a difficult time doesn't make you a failure. You're still growing, still learning, and still figuring things out, just like everyone else. You deserve rest without feeling guilty, happiness without having to earn it, and love even on the days when you feel like you're not doing enough.",weighing:"Whatever it is that's weighing on your heart, I hope you give yourself the same kindness that you give to other people. And if you ever feel like everything is becoming too much, I hope you remember that you can take things one step at a time. You don't have to solve every problem today. For now, it's okay to breathe, to rest, and to let yourself feel whatever you're feeling. I'll never expect you to have everything figured out. I just hope you won't be too hard on yourself, because you're someone who deserves patience, understanding, and so much love.",gifts:"I'm sorry that I can't give you physical gifts or be there beside you whenever you need someone. For now, all I can really give you are these little virtual websites and messages, and I know they might not be enough to make everything feel better. But I hope that, somehow, through these little things and through my words, you can feel the sincerity of my care for you. Even if I can't be there physically, I still want to make you feel that you're not alone.",beautiful:"And please, never forget how beautiful you are, especially when you smile. :DD Your smile has this way of making you look so genuinely happy, and I really, really love seeing that side of you. But please remember that you don't have to smile just to make other people happy. You're allowed to have bad days, too. You deserve to be comforted, understood, and cared for just as much as anyone else. I'm proud of you, not only for the happy moments you show everyone, but also for the difficult moments you might be facing silently.",typos:"I'm sorry if there are any typos here. I'm literally shaking while typing this. :pp I just have so many things I want to tell you, and I don't even know how to put all of them into words properly.",psalm:"There's one verse I'd really like you to read: Psalm 34:18. If you've already read it, I hope you'll take a moment to reflect on its message and keep it close to your heart. Remember that even in moments when your heart feels heavy, you are never beyond God's love and comfort. Even when you don't have the words to explain what you're feeling, I hope you can find a little peace in knowing that He is near. You don't have to go through every difficult moment believing that you're alone, because I hope you'll remember that God sees the things you don't always show other people, too.",sorry1:"I'm sorry if there are times when I fail to notice that something is wrong. I'm sorry if I ever do something that upsets you, makes you overthink, or changes your mood without me realizing it. And I'm sorry if there are moments when my words aren't enough to make you feel better. Sometimes, I wish I knew exactly what to say or do to make things easier for you, but I know I can't always fix everything. Still, I want to keep learning how to understand you better, how to be there for you, and how to show you that you matter to me.",sorry2:"And I'm sorry if I keep saying sorry without always knowing how to make things right. I don't want my apologies to be just words. I want my actions to show you that I genuinely care.",gentle:"Please be gentle with yourself tomorrow, okay? You don't have to force yourself to be happy every single second. If tomorrow is a good day, I hope you enjoy every little moment of it. And if it isn't, I hope you remember that one difficult day doesn't make your life any less beautiful. You deserve happiness, peace, and all the little things that make your heart feel lighter.",glow:"Your happiness has this glow that I can't really explain. I love seeing you happy, I love seeing you smile, and I love seeing you enjoy the little things. I hope life gives you more reasons to smile, and I hope you never feel like you have to face every difficult moment on your own.",only:"And lastly, if I've ever done anything that made you overthink or doubt yourself, I hope I can reassure you of this: there's nobody else. It's you, and it's only you. I never want my actions or the things I fail to say to make you question how much you mean to me. I love you, and I hope I can continue showing you that through more than just words.",beautifulAll:"Everything about you is so unexplainably beautiful to me, even the little things you might not notice about yourself. And I hope that, on the days when you find it difficult to see the good in yourself, you'll remember that someone out here sees so much beauty in you.",okay:"You don't have to be okay all the time. You don't have to hide what you feel. You don't have to prove your worth through your achievements, and you don't have to earn the care and love that you deserve.",care:"Take care of yourself, okay? Please don't forget to rest, eat properly, and give yourself time to breathe, especially when life gets overwhelming. I might not always know when you're struggling, but I hope you know that you can reach out to me whenever you need someone to listen.",rooting:"I'll always be rooting for you, in your happiest moments and even in the moments when you're struggling to find a reason to smile. I'm proud of you for being here, for continuing to try, and for being the person you are.",love:"I love you so much. Please take care of that beautiful heart of yours. You deserve so much happiness, peace, and love, today and every day after. :DD ❤"},ve=[[],[[R.hey,R.thanks]],[R.notice1,R.notice2,R.personal],[R.school,R.family],[R.worth,R.weighing,R.gifts,R.beautiful,R.typos],[R.psalm],[R.sorry1,R.sorry2,R.gentle,R.glow,R.only,R.beautifulAll,R.okay,R.care,R.rooting,R.love]];function tu(){let[e,n]=ye.useState(0),[t,r]=ye.useState(0),[l,o]=ye.useState(0),i=ye.useRef(null),[u,s]=ye.useState(!1),f=ye.useMemo(()=>{return Array.from({length:90}).map((p,w)=>({id:w,x:Math.random()*100,y:Math.random()*70,s:Math.random()*1.4+0.3,d:Math.random()*3+2,delay:Math.random()*5}))},[]),h=ye.useMemo(()=>{return Array.from({length:22}).map((p,w)=>({id:w,x:Math.random()*100,y:Math.random()*100,s:Math.random()*2+0.5,dur:Math.random()*20+12,delay:Math.random()*10}))},[]);ye.useEffect(()=>{if(e!==0)return;let p=Date.now(),w=2500,_=()=>{let N=Math.min(1,(Date.now()-p)/w);if(o(N),N<1)requestAnimationFrame(_);else setTimeout(()=>n(1),400)};requestAnimationFrame(_)},[e]),ye.useEffect(()=>{if(e!==3&&e!==4)return;let p=se
